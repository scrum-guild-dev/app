name: local-d1-tmpfs
description: e2e の手元の D1 などの状態（.wrangler/state）を tmpfs（/dev/shm）に置き、fsync をランナーのディスクの混み具合から切り離す

# CI の e2e では、workerd の主スレッドがランナーのディスクのジャーナルのコミット（fsync の確定）を数秒待ち、
# 静的ファイルを含めてサーバーごと応答しなくなり、5 秒の expect が切れることがあった（#1149）。
# wrangler dev と seed（wrangler d1 --local）はどちらも既定の .wrangler/state を使うので、そこを tmpfs へのリンクにする。
# ジョブごとにランナーが新しいので、状態はジョブが終われば消えてよい。手元の開発と e2e:preflight には使わない。
# checkout と setup の後、e2e を走らせる前に置く（wrangler が .wrangler/state を作る前）
runs:
  using: composite
  steps:
    - name: 手元の D1 の置き場所を tmpfs にする
      shell: bash
      run: |
        set -euo pipefail
        target=/dev/shm/scrum-guild-wrangler-state
        if [[ -e .wrangler/state && ! -L .wrangler/state ]]; then
          echo ".wrangler/state が既にディスクにある。e2e の前、wrangler を動かす前に置く" >&2
          exit 1
        fi
        mkdir -p "$target" .wrangler
        ln -sfn "$target" .wrangler/state
        fstype=$(stat -f -L -c %T .wrangler/state)
        if [[ "$fstype" != tmpfs ]]; then
          echo ".wrangler/state の置き場所が tmpfs でない: $fstype" >&2
          exit 1
        fi
        echo ".wrangler/state -> $target（$fstype）"
