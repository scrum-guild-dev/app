<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrum Guild 出現と行の合図</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="app"></div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";
// #1010 の確認用。データはこのページ内だけで変わり、保存しない。
const { D, esc, icon } = SQ;
let sequence = 0;
const additions = [];
const operation = { suspended: false, reason: "一時停止", limit: 15 };
SQ.mount("backlog", () => `
  ${SQ.pageHead("動きの見本 · #1010", "出現と行の合図", [])}
  <div class="layout-main">
    <p>右上のテーマを切り替えて確認できます。動きを減らす設定では、移動も光も止まります。</p>
    <section class="panel" aria-labelledby="motion-surfaces">
      <h2 id="motion-surfaces" class="panel-title">引き出しとダイアログ</h2>
      <p>引き出しは右から24px、中央は下から8px。前後の切り替えとページ全体は動かしません。閉じるとすぐ戻ります。</p>
      <div class="form-actions">
        <button class="btn" type="button" data-motion-drawer="side">右の引き出し</button>
        <button class="btn" type="button" data-motion-drawer="center">中央の引き出し</button>
        <button class="btn" type="button" data-dialog="createTask">ダイアログ</button>
        <a class="btn" href="task.html?task=t1">ページ全体</a>
      </div>
      <p class="field-hint">引き出し内の「次のタスク」で、面が動き直さないことも確認できます。狭い幅では中央の引き出しも右から出ます。</p>
      ${SQ.book(D.tasks.slice(0, 2))}
    </section>
    <section class="panel" aria-labelledby="motion-additions">
      <h2 id="motion-additions" class="panel-title">足した行</h2>
      <div class="form-actions">
        <button class="btn" type="button" data-motion-add="task">タスクを足す</button>
        <button class="btn" type="button" data-motion-add="story">ストーリーを足す</button>
        <button class="btn" type="button" data-motion-add="epic">エピックを足す</button>
      </div>
      <div class="book" id="motion-added">${additions.filter(({ id, kind }) => kind === "task" ? SQ.task(id) : kind === "story" ? D.stories[id] : D.epics[id]).map(({ id, kind }) => `<div data-motion-row="${id}">${kind === "task" ? SQ.entry(SQ.task(id)) : kind === "story" ? SQ.treeStory(id, true) : SQ.treeEpic(id, { empty: true })}</div>`).join("")}</div>
    </section>
    <section class="panel" aria-labelledby="motion-operator">
      <h2 id="motion-operator" class="panel-title">運用で変わった行</h2>
      <div class="table-wrap"><table class="table is-stacked">
        <thead><tr><th>組織</th><th>状態</th><th>人数の上限</th><th>操作</th></tr></thead>
        <tbody><tr id="motion-organization">
          <td>あおば開発</td>
          <td data-label="状態">${operation.suspended ? esc(operation.reason) : "利用中"}</td>
          <td data-label="人数の上限">${operation.limit} 人</td>
          <td class="is-actions"><span class="table-actions is-wrap">
            <button class="btn is-sm" type="button" data-motion-operation="state">${operation.suspended ? "再開する" : "停止する"}</button>
            ${operation.suspended ? `<button class="btn is-sm" type="button" data-motion-operation="reason">停止の理由を変える</button>` : ""}
            <button class="btn is-sm" type="button" data-motion-operation="limit">上限を変える</button>
          </span></td>
        </tr></tbody>
      </table></div>
      <p class="field-hint">この見本では停止・再開、理由と上限の変更を押すと、表示を変えてその行を一度光らせます。</p>
    </section>
    <section class="panel" aria-labelledby="motion-today">
      <h2 id="motion-today" class="panel-title">今日の完了に移った行</h2>
      <p>今日やることを開き、未完了の行の丸を押すと「今日の完了」に移った行が光ります。</p>
      <a class="btn" href="today.html">今日やることを開く</a>
    </section>
  </div>
`);
document.addEventListener("click", (event) => {
  const drawer = event.target.closest("[data-motion-drawer]");
  if (drawer) {
    SQ.drawerState.mode = drawer.dataset.motionDrawer;
    SQ.openDrawer(D.tasks[0].id, drawer);
    return;
  }
  const add = event.target.closest("[data-motion-add]");
  if (add) {
    const kind = add.dataset.motionAdd, id = `motion${++sequence}`;
    const title = `${{ task: "タスク", story: "ストーリー", epic: "エピック" }[kind]}の見本 ${sequence}`;
    if (kind === "task") D.tasks.push({ id, title, ws: "wa", creator: D.me });
    else if (kind === "story") D.stories[id] = { title, ac: [], body: [], creator: D.me };
    else D.epics[id] = { title, cat: "k1", tier: "small", party: [], body: [], creator: D.me };
    additions.push({ id, kind });
    SQ.redraw();
    SQ.flashRow(document.querySelector(`[data-motion-row="${id}"] .entry, [data-motion-row="${id}"] .tree-row`));
    document.querySelector(`[data-motion-add="${kind}"]`).focus();
    return;
  }
  const action = event.target.closest("[data-motion-operation]");
  if (action) {
    const kind = action.dataset.motionOperation;
    if (kind === "state") operation.suspended = !operation.suspended;
    else if (kind === "reason") operation.reason = operation.reason === "一時停止" ? "解約" : "一時停止";
    else operation.limit = operation.limit === 15 ? 50 : 15;
    SQ.redraw();
    SQ.flashRow(document.getElementById("motion-organization"));
    document.querySelector(`[data-motion-operation="${kind}"]`).focus();
  }
});
</script>
</body>
</html>
