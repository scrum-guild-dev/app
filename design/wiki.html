// ---- 木の引き方 ----
const byId = (id) => store.pages.find((p) => p.id === id);
const kids = (id) => store.pages.filter((p) => p.parent === id);
const tree = (parent = null) => kids(parent).map((p) => ({ id: p.id, title: p.title, children: tree(p.id) }));
const ancestors = (id) => { const out = []; let p = byId(id); while (p && p.parent) { p = byId(p.parent); out.unshift(p); } return out; };
const depthOf = (id) => ancestors(id).length + 1; // 最上段のページが 1 段目
const subtreeHeight = (id) => 1 + Math.max(0, ...kids(id).map((k) => subtreeHeight(k.id)));
const descendants = (id) => kids(id).flatMap((k) => [k.id, ...descendants(k.id)]);

// ---- frontmatter と Markdown（見本の簡易版。本番は src/shared の関数を Worker と画面で共有する） ----
// 先頭の --- で囲んだ行を「キー: 値」として読む。読めない行があれば読めないものとして、全文を本文にする。値の前後の引用符は外す
function splitMd(md) {
  const m = /^---\n([\s\S]*?)\n---(?:\n|$)/.exec(md);
  if (!m) return { rows: null, bad: false, body: md };
  const rows = [];
  for (const line of m[1].split("\n")) {
    if (!line.trim()) continue;
    const kv = /^([^\s:#][^:]*):\s*(.*)$/.exec(line);
    if (!kv) return { rows: null, bad: true, body: md };
    rows.push([kv[1].trim(), kv[2].trim().replace(/^(["'])(.*)\1$/, "$2")]);
  }
  return { rows, bad: false, body: md.slice(m[0].length) };
}
// 題に使う title（前後の空白を除いて 1〜100 字の文字列）。なければ null
function fmTitle(md) {
  const { rows } = splitMd(md);
  const v = rows && rows.find(([k]) => k === "title");
  const s = v ? v[1].trim() : "";
  return s && cpLen(s) <= 100 ? s : null;
}
const titleOf = (md, fallback) => fmTitle(md) ?? fallback.trim();
let uid = 0;
// コードの span を先に退避し、中身は解釈しない（**や[ ]( ) を書いても、そのまま文字で出る）
function inline(src) {
  const codes = [];
  const stashed = src.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  const sameWiki = isOrg ? /^https:\/\/scrum-guild\.dev\/aoba\/wiki\/(\w+)$/ : /^https:\/\/scrum-guild\.dev\/aoba\/w\/wa\/wiki\/(\w+)$/;
  return esc(stashed)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, text, url) => {
      // 今の Wiki と同じ範囲（組織か、同じワークスペース）の URL だけ、画面の中で開く。ほかは普通の、新しいタブのリンク
      const page = sameWiki.exec(url);
      return `<a href="${url}" rel="noopener noreferrer" target="_blank" aria-describedby="wiki-newtab"${page ? ` data-wiki-url="${page[1]}"` : ""}>${text}</a>`;
    })
    .replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`);
}
function renderMd(src) {
  const lines = src.split("\n");
  const out = [];
  const isItem = (l) => /^\s*(?:[-*]|\d+\.)\s/.test(l);
  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    let m;
    if (!line.trim()) { i++; continue; }
    if ((m = /^(#{1,3})\s+(.*)$/.exec(line))) { out.push(`<h${m[1].length + 2} class="doc-h${m[1].length}">${inline(m[2])}</h${m[1].length + 2}>`); i++; continue; }
    if (isItem(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      while (i < lines.length && isItem(lines[i])) { items.push(lines[i].replace(/^\s*(?:[-*]|\d+\.)\s+/, "")); i++; }
      const task = items.some((x) => /^\[[ x]\]\s/.test(x));
      const li = items.map((x) => {
        const c = /^\[([ x])\]\s+(.*)$/.exec(x);
        if (!c) return `<li>${inline(x)}</li>`;
        const id = `wiki-task-${uid++}`;
        return `<li class="is-task"><input type="checkbox" ${c[1] === "x" ? "checked" : ""} disabled aria-labelledby="${id}"><div id="${id}">${inline(c[2])}</div></li>`;
      }).join("");
      out.push(`<${ordered ? "ol" : "ul"}${task ? ' role="list"' : ""}>${li}</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !isItem(lines[i]) && !/^#{1,3}\s/.test(lines[i])) { para.push(lines[i]); i++; }
    out.push(`<p>${inline(para.join(" "))}</p>`);
  }
  return out.join("");
}

// ---- 部分の HTML ----
const person = (id) => `<span class="person">${avatarOf(id)}${esc(user(id).name)}</span>`;
const fmTable = (rows) => `<div class="table-wrap"><table class="table is-properties"><caption class="visually-hidden">ページの frontmatter（題を除く）</caption>
  <thead><tr><th scope="col">キー</th><th scope="col">値</th></tr></thead>

// ページの頭の表と本文。題に使った title は表に出さない。読めない frontmatter は、表を出さずに知らせ、全文を本文として描く
function pageBody(md) {
  const { rows, bad, body } = splitMd(md);
  const shown = rows ? rows.filter(([k]) => !(k === "title" && fmTitle(md) !== null)) : [];
  return `${bad ? `<div class="callout is-warn">${icon("alert")}<span>frontmatter を読めません。本文として表示しています。</span></div>` : ""}
    ${shown.length ? fmTable(shown) : ""}
    <div class="doc-box">${renderMd(bad ? md : body) || '<p class="props-note">本文はまだありません。</p>'}</div>`;
}
const metaLine = (p) => `<p class="props-note">作った人 ${esc(user(p.created).name)}・最後に保存した人 ${esc(user(p.by).name)}・<span class="mono">${fmt(p.at)}</span>・版 <span class="mono">${p.ver}</span></p>`;
// 親の選択欄。height は動かす部分木の高さ（新しいページとアップロードは 1）。親の深さ + height が 10 段を超える親は選べなくして、理由を添える
function parentOptions(selected, { exclude = [], height = 1 } = {}) {
  let over = 0, chosen = false;
  const walk = (id, depth) => kids(id).filter((k) => !exclude.includes(k.id)).flatMap((k) => {
    const tooDeep = depthOf(k.id) + height > MAX_DEPTH;
    if (tooDeep) over++;
    const isSel = k.id === selected && !tooDeep;
    if (isSel) chosen = true;
    return [`<option value="${k.id}" ${isSel ? "selected" : ""} ${tooDeep ? "disabled" : ""}>${"　".repeat(depth)}${esc(k.title)}${tooDeep ? "（10 段を超えるため選べません）" : ""}</option>`, ...walk(k.id, depth + 1)];
  });
  const rest = walk(null, 0).join("");
  const html = `<option value="" ${chosen ? "" : "selected"}>最上段（親なし）</option>${rest}`;
  return { html, over };
}
const parentHint = (id, over) => `<span class="field-hint" id="${id}">深さは ${MAX_DEPTH} 段までです。${over ? `${MAX_DEPTH} 段を超える親（${over} 件）は、選べないようにしています。` : ""}</span>`;

// ---- 左の欄: 検索と木 ----
function searchProblem() {
  const q = S.query.trim();
  if ([...q].length > 100 || q.split(/\s+/u).filter(Boolean).length > 5) return "検索の語は100字・5語までで入れてください。";
  const bytes = store.pages.reduce((sum, p) => sum + new TextEncoder().encode(p.title + p.md).length, 0);
  if (store.pages.length > 5000 || bytes > 32 * 1024 * 1024) return "この Wiki は検索できる量の上限を超えています。検索欄を空にして、木からページを開いてください。";
  return "";
}
function searchHits() {
  const words = S.query.trim().split(/\s+/u).filter(Boolean);
  if (!words.length || searchProblem()) return [];
  const has = (text, w) => text.toLowerCase().includes(w.toLowerCase());
  return store.pages.filter((p) => words.every((w) => has(p.title, w) || has(p.md, w)))
    .map((p) => ({ p, titleHit: words.every((w) => has(p.title, w)), where: words.some((w) => has(p.title, w)) ? "title" : "body" }))
    .sort((a, b) => Number(b.titleHit) - Number(a.titleHit) || b.p.at.localeCompare(a.p.at) || a.p.id.localeCompare(b.p.id)).slice(0, 50);
}
function listHtml() {
  if (!S.query.trim()) {
    return store.pages.length
      ? `<nav aria-label="${scopeName}のページ">${wikiTree(tree(), { current: S.mode === "new" ? null : S.page, open: [...S.open], reorder: S.reorder, key: "wk" })}</nav>`
      : `<p class="props-note">まだありません。</p>`;
  }
  return `<ul class="wiki-tree">${searchHits().map(({ p, where }) => wikiHit(p, ["Wiki", ...ancestors(p.id).map((x) => x.title)].join(" / "), where, p.id === S.page && S.mode !== "new")).join("")}</ul>`;
}
function statusText() {
  const q = S.query.trim();
  if (!q) return "";
  if (searchProblem()) return searchProblem();
  const n = searchHits().length;
  return n ? `${n} 件のページが見つかりました` : `「${q}」に当たるページはありません。語を減らすか、別の語で探してください。`;
}
function sideHtml() {
  const searching = S.query.trim() !== "";
  return `<aside class="wiki-side" aria-label="${scopeName}の検索とページの木">
    <form class="form" id="wiki-search-form" role="search" aria-label="Wiki の題と本文を探す"><div class="field"><label for="wiki-q">Wiki の題と本文を探す</label><input class="input" type="search" id="wiki-q" value="${esc(S.query)}" aria-describedby="wiki-q-hint wiki-q-status">
      <p class="field-hint" id="wiki-q-hint">この Wiki の中だけを探します。空白で区切って5語・100字まで。</p></div>
      <div class="form-actions"><button class="btn" type="submit">探す</button></div></form>
      <p class="field-hint" role="status" id="wiki-q-status">${esc(statusText())}</p>
    <div class="panel">
      <div class="panel-title"><b>ページ</b><span class="props-note">${store.pages.length} 件</span>
        <button class="btn is-sm is-quiet toolbar-end" type="button" id="wiki-reorder" data-wiki="reorder" aria-pressed="${S.reorder}" ${searching ? "hidden" : ""}>${icon("swap")}並べ替える</button></div>
      <div id="wiki-list">${listHtml()}</div>
    </div></aside>`;
}

// ---- 右の欄 ----
function topHtml() {
  const top = kids(null);
  return `<section class="section" aria-labelledby="wiki-main-title">
    <div class="section-head"><h2 class="section-title" id="wiki-main-title" tabindex="-1">最上段のページ</h2><span class="section-count">${top.length} 件</span></div>
    ${top.length ? `<ul class="wiki-tree panel">${top.map((p) => `<li><a class="wiki-link" href="#${p.id}" data-wiki-page="${p.id}"><span>${esc(p.title)}</span><span class="props-note">${kids(p.id).length ? `子のページ ${kids(p.id).length} 件・` : ""}${esc(user(p.by).name)}が ${fmt(p.at)} に保存</span></a></li>`).join("")}</ul>
      <p class="props-note">左の木からページを選ぶと、ここに開きます。</p>`
      : emptyState("file", "ページはまだありません", "ページを足して、チームの手順や決まりを残せます。")}</section>`;
}
function notFoundHtml() {

function mainHtml() {

}

function render() {
  const head = pageHead(store.name, "Wiki", [],
    // 本番と同じく、「.md を上げる」は書いている間（足す、編集）は出さない
    `${S.mode === "new" || S.mode === "edit" ? "" : `<button class="btn" type="button" data-wiki="upload">${t("wikiUpload")}</button>`}<button class="btn is-primary" type="button" data-wiki="new-root">ページを足す</button>`,
    `<p class="props-note">${isOrg ? `${t("organization")}の Wiki。${t("organization")}のユーザーの全員が見て、全員が書けます。` : `${t("workspace")}の Wiki。メンバー全員（${t("admin")}を含む）が見て、全員が書けます。`}</p>`);
  // リンクの説明（新しいタブで開く）。本文のリンクの aria-describedby が指す、画面で1つだけの隠した文
  return `${head}<span id="wiki-newtab" hidden>${t("markdownNewTab")}</span><div class="layout-wiki">${sideHtml()}<div class="wiki-main" id="wiki-main">${mainHtml()}</div></div>${statesHtml()}`;
}

// ---- 動き ----
function redraw(focusSel) {
  SQ.redraw();
  const el = document.querySelector(focusSel || "#wiki-main-title");
  if (el) el.focus();
}
function savePage(p, title, md) {
  p.history = [{ v: p.ver, by: p.by, at: p.at, title: p.title, md: p.md }, ...(p.history || [])].slice(0, MAX_VERSIONS - 1);
  p.ver += 1; p.title = titleOf(md, title); p.md = md; p.by = me; p.at = NOW;
}
function openPage(id, mode = "read") {
  S.page = id || null; S.mode = mode; S.ver = null; S.draft = null;
  for (const a of id ? ancestors(id) : []) S.open.add(a.id);
}
function removePage(p) {
  const lifted = kids(p.id);
  store.pages = store.pages.filter((x) => x !== p && !lifted.includes(x));
  for (const c of lifted) { c.parent = p.parent; store.pages.push(c); } // 子は消したページの親の下の末尾へ、元の並びで上がる
}
// 書きかけ（編集中と新しいページ）に、保存していない変更があるか
function isDirty() {
  if (S.mode !== "edit" && S.mode !== "new") return false;
  const body = document.getElementById("wk-body"), title = document.getElementById("wk-title");
  if (!body || !title) return false;
  if (S.mode === "new") return body.value.trim() !== "" || title.value.trim() !== "";
  const p = byId(S.page);
  return body.value !== p.md || (!title.readOnly && title.value !== p.title);
}
// 別のページや別の表示へ移る操作。書きかけに変更があれば、捨てるかを確かめてから移る
function go(fn) {
  if (!isDirty()) { fn(); return; }
  S.pending = fn;
  openDialog("書きかけを捨てますか",
    `<p class="wrap-anywhere">題か本文に、保存していない変更があります。捨てて移ると、書いた内容は戻せません。</p>`,
    `<button class="btn is-quiet" type="button" data-close-dialog>続けて書く</button><button class="btn is-danger" type="button" data-close-dialog data-wiki="discard-do">捨てて移る</button>`);
  document.querySelector(".dialog-sheet").classList.add("is-danger");
}
let movingPageId = null;
function moveDialog(p) {

  const ex = [p.id, ...descendants(p.id)];
  const { html, over } = parentOptions(p.parent, { exclude: ex, height: subtreeHeight(p.id) });
  openDialog("親を移す",
    `<p class="wrap-anywhere">「${esc(p.title)}」を、同じ ${isOrg ? t("organization") : t("workspace")}の Wiki の中の別のページの下へ移します。子のページは一緒に動きます。</p>
     <div class="field"><label class="field-label" for="wk-move">移す先の親</label><select class="select" id="wk-move" aria-describedby="wk-move-hint">${html}</select>
       ${parentHint("wk-move-hint", over).replace("</span>", ` 自分と子孫は選べません。${isOrg ? "" : `${t("workspace")}の外や、${t("organization")}の Wiki へは移せません。`}</span>`)}</div>`,
    `<button class="btn is-quiet" type="button" data-close-dialog>やめる</button><button class="btn is-primary" type="button" data-wiki="move-do">移す</button>`);
}
function deleteDialog(p) {
  const n = kids(p.id).length;
  const up = p.parent ? `「${esc(byId(p.parent).title)}」` : "最上段";
  openDialog("ページを消す",

     <p>${n ? `子のページ ${n} 件は、消したページの親の下（${up}）へ上がります。` : "子のページはありません。"}</p>
     <p class="field-hint">消せるのは、${isOrg ? `作った人と${t("admin")}` : `作った人、${t("leader")}、${t("admin")}`}です。</p>`,

function restoreDialog(p) {
  openDialog(`第 ${S.ver} 版に戻す`,
    `<p class="wrap-anywhere">第 ${S.ver} 版の題と本文で保存します。第 ${p.ver + 1} 版として足され、今の第 ${p.ver} 版も版の一覧に残ります。</p>`,
    `<button class="btn is-quiet" type="button" data-close-dialog>やめる</button><button class="btn is-primary" type="button" data-close-dialog data-wiki="restore-do">戻す</button>`);
}
// 上げる .md の例。決まる題は、frontmatter の title、無ければファイル名（.md を除く）。足せないもの: .md でない、本文が 10 万字を超える、題が 1〜100 字に収まらない
const SAMPLE_FILES = [
  { name: "リリース後の振り返り.md", md: "# リリース後の振り返り\n\n出した版で気づいたことを書く。", chars: 1240 },
  { name: "連絡網.md", md: "---\ntitle: 障害対応の連絡網\nowner: リン\n---\n## 連絡の順\n\n1. 当番\n2. リーダー", chars: 860 },
  { name: "全議事録まとめ.md", md: "# 議事録", chars: 148000 },
  { name: `${"長い名前".repeat(26)}.md`, md: "# 長い名前のページ", chars: 300 },
];
const uploadTitle = (f) => titleOf(f.md, f.name.replace(/\.md$/i, ""));
const uploadProblem = (f) => !/\.md$/i.test(f.name) ? ".md ではないため、足せません。"
  : f.chars > 100000 ? "本文が 10 万字を超えているため、足せません。"
  : cpLen(uploadTitle(f)) < 1 || cpLen(uploadTitle(f)) > 100 ? t("wikiUploadTitleInvalid")
  : "";
function uploadParts() {
  const u = S.upload;
  const ok = u.files.length > 0 && u.files.length <= MAX_UPLOAD && u.files.every((f) => !uploadProblem(f));
  const { html, over } = parentOptions(u.parent, { height: 1 });
  const body = `<div class="field"><label class="field-label" for="wk-up-parent">足す場所（親のページ）</label><select class="select" id="wk-up-parent" aria-describedby="wk-up-hint">${html}</select>
       ${parentHint("wk-up-hint", over).replace("</span>", " 選んだ親の下に、1ファイルを1つの新しいページとして足します。既にあるページは上書きしません。</span>")}</div>
     <div class="dropzone">${icon("upload")}<span class="dropzone-text"><b>ここに .md をドラッグ</b><span>複数をまとめて選べます。一度に ${MAX_UPLOAD} ファイルまで。フォルダと zip は受け付けません。</span></span>
       <button class="btn is-sm" type="button" data-wiki="upload-pick">${icon("clip")}ファイルを選ぶ</button></div>
     ${u.files.length ? `<div class="files" role="group" aria-label="上げるファイル">${u.files.map((f, i) => {
       const why = uploadProblem(f);
       const heading = fmTitle(f.md);
       const title = uploadTitle(f);
       return `<div class="file-row${why ? " is-error" : ""}">${icon(why ? "alert" : "file")}<div class="file-main"><span class="file-name">${esc(f.name)}</span>
         <span class="file-meta">${why ? esc(why) : `題: ${esc(title)}（${heading ? "frontmatter の title" : "ファイル名"}）・${f.chars.toLocaleString("ja-JP")} 字`}</span></div>
         <div class="file-actions"><button class="btn is-sm is-quiet" type="button" data-wiki="upload-remove:${i}" aria-label="${esc(f.name)}を外す">外す</button></div></div>`;
     }).join("")}</div>` : ""}
     <p class="props-note" role="status">${u.files.length} / ${MAX_UPLOAD} ファイル${u.files.length && !ok ? "。足せないファイルを外すと足せます。" : ""}</p>
     <p class="field-hint">題は frontmatter の title、無ければファイル名（.md を除く）。上げた .md を落として上げ直すと、題と、題以外の frontmatter のキーと、本文が同じページができます。</p>`;
  const foot = `<button class="btn is-quiet" type="button" data-close-dialog>やめる</button><button class="btn is-primary" type="button" data-wiki="upload-do" ${ok ? "" : 'aria-disabled="true"'}>${u.files.length ? `${u.files.length} 件をページとして足す` : "足す"}</button>`;
  return { body, foot };
}
function uploadDialog() {
  const { body, foot } = uploadParts();
  openDialog(t("wikiUpload"), body, foot);
}
// 開いたままのダイアログの中身だけを差し替える（開いた元の要素を引き継ぐため、開き直さない）
function refreshUpload(focus) {
  const { body, foot } = uploadParts();
  document.querySelector("#dialog .dialog-body").innerHTML = body;
  document.querySelector("#dialog .dialog-foot").innerHTML = foot;
  document.querySelector(focus)?.focus();
}
const readParent = (id) => document.getElementById(id)?.value || null;

// つまみのドラッグは、ボタンと同じ並び・親の変更を使う。
let draggingWikiId = null;
let wikiDrop = null;
function clearWikiDrop() {
  document.querySelectorAll('[data-wiki-node][data-drop], [data-wiki-row][data-drop]').forEach((node) => node.removeAttribute('data-drop'));
}
document.addEventListener('dragstart', (event) => {
  const grip = event.target.closest('[data-wiki-grip]');
  if (!grip) return;
  draggingWikiId = grip.dataset.wikiGrip;
  event.dataTransfer.setData('text/plain', draggingWikiId);
  event.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragover', (event) => {
  const row = event.target.closest('[data-wiki-row]');
  if (!draggingWikiId || !row) { wikiDrop = null; clearWikiDrop(); return; }
  const target = byId(row.dataset.wikiRow);
  if (target.id === draggingWikiId || descendants(draggingWikiId).includes(target.id)) { wikiDrop = null; clearWikiDrop(); return; }
  event.preventDefault();
  clearWikiDrop();
  const rect = row.getBoundingClientRect();
  const fraction = (event.clientY - rect.top) / rect.height;
  const part = fraction < .25 ? 'before' : fraction > .75 ? 'after' : 'child';
  (part === 'child' ? row : row.closest('[data-wiki-node]')).dataset.drop = part;
  wikiDrop = { target, part };
});
document.addEventListener('drop', (event) => {
  if (!draggingWikiId || !wikiDrop || event.target.closest('[data-wiki-row]')?.dataset.wikiRow !== wikiDrop.target.id) return;
  event.preventDefault();
  const moving = byId(draggingWikiId), { target, part } = wikiDrop;
  const parent = part === 'child' ? target.id : target.parent;
  if ((parent ? depthOf(parent) : 0) + subtreeHeight(moving.id) > MAX_DEPTH) toast(`${icon('alert')}子のページを含めて10段を超えるため、移せません。`);
  else {
    store.pages = store.pages.filter((item) => item !== moving);
    moving.parent = parent;
    if (part === 'child') store.pages.push(moving);
    else store.pages.splice(store.pages.indexOf(target) + (part === 'after' ? 1 : 0), 0, moving);
    if (parent) S.open.add(parent);
    redraw(); toast(`${icon('check')}「${esc(moving.title)}」を移しました`);
  }
  draggingWikiId = null; wikiDrop = null; clearWikiDrop();
});
document.addEventListener('dragend', () => { draggingWikiId = null; wikiDrop = null; clearWikiDrop(); });
document.addEventListener("click", (ev) => {
  const crumb = ev.target.closest("[data-crumbs-more]");
  if (crumb) { document.querySelectorAll("[data-crumb-mid]").forEach((li) => (li.hidden = false)); const first = document.querySelector("[data-crumb-mid] a"); crumb.closest("li").remove(); first?.focus(); return; }
  const tog = ev.target.closest("[data-tree-toggle]");
  if (tog) { // 枝の開閉は kit が受ける（先に動く）。開いている枝を覚え、描き直しても保つ
    const id = tog.dataset.treeToggle.replace(/^wk-c-/, "");
    if (tog.getAttribute("aria-expanded") === "true") S.open.add(id); else S.open.delete(id);
    return;
  }
  const link = ev.target.closest("[data-wiki-page]");
  if (link) { ev.preventDefault(); go(() => { openPage(link.dataset.wikiPage); redraw(); }); return; }
  const url = ev.target.closest("[data-wiki-url]");
  if (url) { ev.preventDefault(); go(() => { openPage(url.dataset.wikiUrl); redraw(); }); return; }
  const mv = ev.target.closest("[data-wiki-move]");
  if (mv) {
    if (mv.getAttribute("aria-disabled") === "true") return;
    const [id, dir] = mv.dataset.wikiMove.split(":");
    const p = byId(id), sibs = kids(p.parent), j = sibs.indexOf(p) + (dir === "up" ? -1 : 1);
    if (j < 0 || j >= sibs.length) return;
    const a = store.pages.indexOf(p), b = store.pages.indexOf(sibs[j]);
    [store.pages[a], store.pages[b]] = [store.pages[b], store.pages[a]];
    SQ.redraw();
    (document.querySelector(`[data-wiki-move="${id}:${dir}"]:not([aria-disabled])`) ?? document.querySelector(`[data-wiki-move="${id}:${dir === "up" ? "down" : "up"}"]`))?.focus();
    toast(`${icon("check")}「${esc(p.title)}」を${dir === "up" ? "上へ" : "下へ"}移しました`);
    return;
  }
  const el = ev.target.closest("[data-wiki]");
  if (!el || el.getAttribute("aria-disabled") === "true") return;
  const [act, arg] = el.dataset.wiki.split(":");
  const p = S.page ? byId(S.page) : null;
  if (act === "reorder") { S.reorder = !S.reorder; SQ.redraw(); document.getElementById("wiki-reorder")?.focus(); }
  else if (act === "edit") { S.mode = "edit"; S.draft = null; redraw("#wk-title"); }
  else if (act === "cancel") go(() => { S.mode = "read"; S.draft = null; redraw(); });
  else if (act === "read") { S.mode = "read"; S.ver = null; redraw(); }
  else if (act === "versions") { S.mode = "versions"; S.ver = null; redraw(); }
  else if (act === "old") { S.mode = "old"; S.ver = Number(arg); redraw(); }
  else if (act === "new-root") go(() => { S.mode = "new"; S.draft = null; S.newParent = null; redraw("#wk-title"); });
  else if (act === "new-child") go(() => { S.mode = "new"; S.draft = null; S.newParent = S.page; redraw("#wk-title"); });
  else if (act === "discard-do") { const fn = S.pending; S.pending = null; S.draft = null; S.mode = "read"; if (fn) fn(); }
  else if (act === "download") toast(`${icon("check")}「${esc(p.title)}.md」を落としました${splitMd(p.md).bad ? "（frontmatter を読めないページなので、題を足さず本文のまま書き出しています）" : fmTitle(p.md) ? "" : "（frontmatter に title が無いので、題を足して書き出しています）"}`);
  else if (act === "move") moveDialog(arg ? byId(arg) : p);
  else if (act === "move-do") {
    const p = byId(movingPageId ?? S.page);
    movingPageId = null;
    const to = readParent("wk-move"); // 値は閉じる前に読む
    closeDialog();
    if (to === p.parent) { toast(`${icon("check")}親は変わっていません`); return; }
    store.pages = store.pages.filter((x) => x !== p); p.parent = to; store.pages.push(p);
    if (to) S.open.add(to);
    redraw(); toast(`${icon("check")}「${esc(p.title)}」を移しました`);
  }
  else if (act === "delete") deleteDialog(p);
  else if (act === "delete-do") { const title = p.title; const up = p.parent; removePage(p); openPage(up); redraw(); toast(`${icon("check")}「${esc(title)}」を消しました`); }
  else if (act === "restore") restoreDialog(p);
  else if (act === "restore-do") {
    const r = p.history.find((x) => x.v === S.ver);
    if (titleOf(r.md, r.title) === p.title && r.md === p.md) { S.mode = "read"; S.ver = null; redraw(); toast(`${icon("check")}今の版と同じ内容です。版は足していません`); return; }
    savePage(p, r.title, r.md); const v = S.ver; S.mode = "read"; S.ver = null; redraw();
    toast(`${icon("check")}第 ${v} 版の題と本文で保存しました（第 ${p.ver} 版）`);
  }
  else if (act === "upload") { S.upload = { files: [], parent: S.page && depthOf(S.page) + 1 <= MAX_DEPTH ? S.page : null }; uploadDialog(); }
  else if (act === "upload-pick") {
    S.upload.parent = readParent("wk-up-parent");
    const have = new Set(S.upload.files.map((f) => f.name));
    const more = SAMPLE_FILES.filter((f) => !have.has(f.name)); // 選び直しても、同じファイルを重ねない
    S.upload.files = [...S.upload.files, ...more].slice(0, MAX_UPLOAD);
    refreshUpload('[data-wiki="upload-pick"]');
    if (!more.length) toast(`${icon("alert")}見本のファイルはすべて選んであります`);
  }
  else if (act === "upload-remove") { S.upload.parent = readParent("wk-up-parent"); S.upload.files.splice(Number(arg), 1); refreshUpload('[data-wiki="upload-pick"]'); }
  else if (act === "upload-do") {
    const parent = readParent("wk-up-parent"); // 値は閉じる前に読む
    const files = S.upload.files;
    if (parent && depthOf(parent) + 1 > MAX_DEPTH) { toast(`${icon("alert")}深さは ${MAX_DEPTH} 段までです。足す場所を選び直してください。`); return; }
    closeDialog();
    for (const f of files) store.pages.push({ id: `n${Date.now()}${store.pages.length}`, parent, title: uploadTitle(f), created: me, by: me, at: NOW, ver: 1, md: f.md });
    if (parent) S.open.add(parent);
    S.upload = null; redraw(); toast(`${icon("check")}${files.length} 件のページを足しました`);
  }
});
document.addEventListener("submit", (ev) => {
  if (!ev.target.matches("[data-wiki-form]")) return;
  ev.preventDefault();
  if (S.saving) return;
  const titleEl = document.getElementById("wk-title"), bodyEl = document.getElementById("wk-body");
  const body = bodyEl.value.replace(/\r\n?/g, "\n");
  const title = titleOf(body, titleEl.value);
  const problem = (el, errId, text) => { const e = document.getElementById(errId); e.querySelector("span").textContent = text; e.hidden = !text; if (text) el.setAttribute("aria-invalid", "true"); else el.removeAttribute("aria-invalid"); return !!text; };
  const badTitle = problem(titleEl, "wk-title-error", cpLen(title) < 1 || cpLen(title) > 100 || title.includes("\u0000") ? "題は、前後の空白を除いて 1〜100 字で入れてください。" : "");
  const badBody = problem(bodyEl, "wk-body-error", cpLen(body) > 100000 ? `本文は 10 万字までです（今は ${cpLen(body).toLocaleString("ja-JP")} 字）。` : body.includes("\u0000") ? "本文に使えない文字（NUL）が含まれています。" : "");
  if (badTitle || badBody) { (badTitle ? titleEl : bodyEl).focus(); return; }
  // 本番でも API が 409 too_deep で断る。見本は選べない親を送らせない
  const newParent = S.mode === "new" ? readParent("wk-parent") : null;
  if (newParent && depthOf(newParent) + 1 > MAX_DEPTH) { toast(`${icon("alert")}深さは ${MAX_DEPTH} 段までです。親を選び直してください。`); return; }
  // 送っている間は、保存とやめるを押せなくする（二重に送らない）
  S.saving = true;
  const submit = document.getElementById("wk-submit");
  submit.setAttribute("aria-disabled", "true"); submit.textContent = "保存しています";
  document.querySelector('[data-wiki="cancel"]').setAttribute("aria-disabled", "true");
  document.getElementById("wk-saving").textContent = "保存しています";
  setTimeout(() => {
    S.saving = false;
    if (S.mode === "new") {
      const parent = readParent("wk-parent");
      const page = { id: `n${Date.now()}`, parent, title, created: me, by: me, at: NOW, ver: 1, md: body };
      store.pages.push(page);
      if (parent) S.open.add(parent);
      openPage(page.id); redraw(); toast(`${icon("check")}ページを足しました`);
    } else {
      const p = byId(S.page);
      if (title === p.title && body === p.md) { S.mode = "read"; S.draft = null; redraw(); toast(`${icon("check")}変わっていないので、版は足していません`); return; }
      savePage(p, title, body); S.mode = "read"; S.draft = null; redraw(); toast(`${icon("check")}保存しました（第 ${p.ver} 版）`);
    }
  }, 350);
});
let searchTimer;
let searchComposing = false;
let searchPending = false;
function setSearchPending(value) {
  searchPending = value;
  document.querySelector('#wiki-search-form button')?.setAttribute('aria-disabled', String(value));
}
function refreshSearch() {
  setSearchPending(false);
  document.getElementById("wiki-list").innerHTML = listHtml();
  document.getElementById("wiki-q-status").textContent = statusText();
  const searching = S.query.trim() !== "";
  const btn = document.getElementById("wiki-reorder");
  btn.hidden = searching;
}
document.addEventListener("submit", (ev) => {
  if (ev.target.id !== "wiki-search-form") return;
  ev.preventDefault();
  if (searchPending || searchComposing) return;
  clearTimeout(searchTimer); setSearchPending(true); searchTimer = setTimeout(refreshSearch, 800);
});
document.addEventListener("compositionstart", (ev) => {
  if (ev.target.id !== "wiki-q") return;
  searchComposing = true; setSearchPending(false); clearTimeout(searchTimer);
});
function endSearchComposition(ev) {
  if (ev.target.id !== "wiki-q") return;
  searchComposing = false; clearTimeout(searchTimer);
  setSearchPending(true); searchTimer = setTimeout(refreshSearch, 800);
}
document.addEventListener("compositionend", endSearchComposition);
document.addEventListener("focusout", (ev) => { if (searchComposing) endSearchComposition(ev); });
document.addEventListener("input", (ev) => {
  const id = ev.target.id;
  if (id === "wiki-q") {
    S.query = ev.target.value;
    clearTimeout(searchTimer);
    if (!S.query.trim()) refreshSearch();
    else if (!searchComposing) { setSearchPending(true); searchTimer = setTimeout(refreshSearch, 800); }
    return;
  }
  if (id === "wk-title" || id === "wk-body") {
    // 入力が変わったら、その欄の誤りを消す。書きかけは覚えておき、画面を描き直しても（並べ替えなど）残す
    const err = document.getElementById(`${id}-error`);
    err.hidden = true; ev.target.removeAttribute("aria-invalid");
    const body = document.getElementById("wk-body").value.replace(/\r\n?/g, "\n");
    S.draft = { title: document.getElementById("wk-title").value, body, parent: document.getElementById("wk-parent")?.value || null };
    if (id === "wk-body") {
      // frontmatter に有効な title があれば、それが題になる。題の欄は読み取りだけにして、値を映す
      const fixed = fmTitle(body);
      const input = document.getElementById("wk-title");
      input.readOnly = fixed !== null;
      if (fixed !== null) input.value = fixed;
      document.getElementById("wk-title-hint").textContent = fixed !== null ? "本文の frontmatter の title が題です。変えるときは本文を直します。" : "前後の空白を除いて 1〜100 字。本文の先頭の frontmatter に title を書くと、そちらが題になります。";
    }
  }
});
document.addEventListener("change", (ev) => {
  if (ev.target.id === "wk-parent" && S.draft) S.draft.parent = ev.target.value || null;
  else if (ev.target.id === "wk-parent") S.newParent = ev.target.value || null;
});

SQ.mount(isOrg ? "orgwiki" : "wiki", render);
</script>
</body>
