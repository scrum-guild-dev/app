<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrum Guild スプリント</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Old+Mincho:wght@700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="app"></div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";
// スプリント: 進行中のスプリントの列とカード
const { D, t, icon, pageHead, sprintNotice, board, capacityRows, sumPts } = SQ;

// ?overdue は、最終日を過ぎた進行中のスプリントの状態。ふだんの見本の最終日（10/26）の前に今日があるので、期間を1週間前へずらして今日が最終日より後になる形にする。
// 本番は SprintOverdueNotice.svelte で、進行中で、ワークスペースの今日が最終日より後のときに出す（スプリントの画面と計画の画面）
const overdue = new URLSearchParams(location.search).has("overdue");
if (overdue && D.sprints.sp14) Object.assign(D.sprints.sp14, { start: "2026-10-06", end: "2026-10-19", dayIndex: D.sprints.sp14.days });

// 最終日を過ぎた知らせ。終える人（リーダーと管理者）には「終える」を添えて終了のダイアログを開き、ほかの人には終えるのがリーダーだと伝える
function overdueNotice(id) {
  const label = SQ.sprintLabel(id);
  const end = SQ.md(D.sprints[id].end);
  const canClose = SQ.user(D.me).role === "leader";
  return `<div class="callout is-warn">${icon("alert")}<span>${canClose
    ? `${label}は最終日（${end}）を過ぎています。終わらなかった${t("task")}の行き先を決めて、終えてください。`
    : `${label}は最終日（${end}）を過ぎています。終えるのは${t("leader")}です。`}</span>${canClose
    ? `<div class="callout-actions"><button class="btn is-sm" type="button" data-dialog="sprintEnd" aria-label="終える: ${label}">終える</button></div>` : ""}</div>`;
}

SQ.mount("sprint", () => {
  const s = D.sprints.sp14;
  if (!s) {
    // 進行中のスプリントがない。作って始めるのはリーダー
    const isLeader = SQ.user(D.me).role === "leader";
    return `
      ${pageHead(D.workspaces.wa.name, t("sprint"))}
      ${SQ.emptyState("columns", `進行中の${t("sprint")}はありません`,
        isLeader
          ? `${t("plan")}の画面で${t("sprint")}を作り、${t("backlog")}から${t("task")}を入れてから始めます。始めると、ここに${t("column")}とカードが並びます。`
          : `${t("sprint")}を作って始めるのは${t("leader")}です。${t("sprint")}に入っていない${t("task")}も、${t("backlog")}から進めて完了にできます。`,
        isLeader
          ? `<a class="btn is-sm" href="${SQ.firstHref("plan.html")}">${t("plan")}を開く</a>`
          : `<a class="btn is-sm" href="${SQ.firstHref("backlog.html")}">${t("backlog")}を開く</a>`, undefined, "notice")}`;
  }
  const list = SQ.tasksWhere((x) => x.sprint === "sp14");
  const done = sumPts(list.filter((x) => x.doneAt)), all = sumPts(list);
  const actions = `<button class="btn" type="button" data-dialog="sprintEditActive">名前と${t("sprintGoal")}を変更</button>
    <button class="btn" type="button" data-dialog="sprintExtend">延長する</button>
    <button class="btn" type="button" data-dialog="sprintEnd">終える</button>`;
  return `
    ${pageHead(`${SQ.md(s.start)}〜${SQ.md(s.end)}・${s.days} 日のうち ${Math.min(s.dayIndex + 1, s.days)} 日目`, SQ.sprintLabel("sp14"), [
      ["", "check", `${t("done")}（pt）`, done],
      ["", "", "合計（pt）", all],
      ["", "clock", "残り（日）", s.days - s.dayIndex],
    ], actions)}
    ${s.extended ? `<p class="action-note">延長 ${s.extended} 日</p>` : ""}
    ${overdue ? overdueNotice("sp14") : ""}
    ${sprintNotice("sp14", { showWs: false })}
    ${board("sp14", { draft: true })}
    <p class="action-note" id="board-key-hint">カードは別の${t("column")}へドラッグして移せます。キーボードでは、カードを選んで Alt と ← → で隣の${t("column")}、Alt と ↑ ↓ で${t("column")}の中を動かせます。カードの「⋯」のメニューでも同じです。</p>
    <p class="action-note">${t("column")}の末尾の空の行に題を打って Enter を押すと、その${t("column")}に${t("task")}が足されます。</p>
    <section class="section" aria-labelledby="cap">
      <div class="section-head"><h2 class="section-title" id="cap">この${t("sprint")}の${t("capacity")}</h2><span class="section-hint">1 ${t("points")} = ${D.hoursPerPoint} 時間・許容幅 ±12.5%</span></div>
      <div class="panel"><div class="grid-2">${capacityRows()}</div></div>
    </section>`;
});
</script>
</body>
</html>
