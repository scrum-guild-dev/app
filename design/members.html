<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrum Guild メンバー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Old+Mincho:wght@700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="app"></div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";
// メンバー: ロール、配分、招待
const { D, t, icon, esc, pageHead, avatarOf, emblem, user, loginTarget } = SQ;

SQ.mount("members", () => {
  const now = D.members.filter((m) => !m.left);
  // 離脱した人の行は出さない（本番の member-list は所属している人だけを返し、列は参加日だけ）
  const rows = now.map((m) => {
    const u = user(m.who);
    const allocOptions = `<option ${m.alloc == null ? "selected" : ""}>未設定</option>` + Array.from({ length: 21 }, (_, i) => i * 5).map((v) => `<option ${m.alloc === v ? "selected" : ""}>${v}%</option>`).join("");
    return `<tr>
      <td class="is-name"><span class="person">${avatarOf(m.who)}${esc(u.name)}${emblem(u.level, true)}</span></td>
      <td data-label="ロール"><select class="select" aria-label="${esc(u.name)}のロール"><option ${m.role === "leader" ? "selected" : ""}>${t("leader")}</option><option ${m.role === "member" ? "selected" : ""}>一般</option></select></td>
      <td class="mono" data-label="参加日">${m.joined}</td>
      <td data-label="配分（11月）"><select class="select" aria-label="${esc(u.name)}の11月の配分">${allocOptions}</select></td>
      <td class="is-actions">${m.who === D.me ? `<button class="btn is-sm is-quiet" type="button">抜ける</button>` : `<button class="btn is-sm is-quiet is-danger" type="button">外す</button>`}</td>
    </tr>`;
  }).join("");
  return `
    ${pageHead(D.workspaces.wa.name, "メンバー", [
      ["", "users", "所属", now.length],
      ["", "", t("leader"), now.filter((m) => m.role === "leader").length],
      ["is-warn", "", "11月の配分が未設定", now.filter((m) => m.alloc == null).length],
      ["", "mail", "招待中", D.invitations.filter((i) => !i.expired).length],
    ])}
    <section class="section"><div class="section-head"><h2 class="section-title">所属している人</h2><span class="section-hint">配分は11月の値。他の${t("workspace")}の配分は見えません</span></div>
      <div class="table-wrap"><table class="table is-stacked"><thead><tr><th class="is-name">名前</th><th>ロール</th><th>参加日</th><th>配分（11月）</th><th class="is-actions"><span class="visually-hidden">操作</span></th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="action-note">外すと、その人の未完了の${t("task")}は担当なしに戻り、${t("party")}からも外れます。完了の記録と経験値は残ります。</p>
    </section>
    <section class="section"><div class="section-head"><h2 class="section-title">招待する</h2><span class="section-hint">${t("organization")}の人数 ${D.seats.used} / ${D.seats.limit} 人</span></div>
      <div class="panel">
        <div class="form-row">
          ${loginTarget("login")}
          <div class="field"><span class="field-label">ロール</span><div class="segmented" role="radiogroup"><label><input type="radio" name="role" checked><span>一般</span></label><label><input type="radio" name="role"><span>${t("leader")}</span></label></div></div>
          <button class="btn is-primary" type="button" data-invite-link="login" data-invite-done="招待しました" data-invite-kind="workspace">${icon("mail")}招待する</button>
        </div>
        <span class="field-hint">Scrum Guild は招待をメールで送りません。Google の招待は、招待したときに出る招待の URL（14日で切れます）を本人に伝えてください。GitHub の招待は、次の${t("organization")}の URL を伝えてください。 <span class="mono wrap-anywhere">https://scrum-guild.dev/${esc(D.organization)}/</span></span>
      </div>
      <div class="panel">
        <div class="callout is-warn">${icon("alert")}<span>${t("organization")}の人数が上限（${D.seats.limit} 人）に達しているため、新しい人は招待できません。すでに${t("organization")}にいる人は招待できます。上限を上げるには${t("admin")}に相談してください。</span></div>
        <div class="form-row is-start">
          ${loginTarget("login-full", { hints: { github: "GitHub のユーザー ID に解決します。「確かめる」を押して、招待する人を見て確かめてから招待します。" }, action: `<button class="btn" type="button" data-toast="見本のため、確かめません">確かめる</button>` })}
        </div>
        <div class="callout is-info">${icon("shield")}<span>この人を招待します。アバター、ユーザー名、表示名が、招待したい人のものか確かめてください。ユーザー名は 1 字違いでも別の人に当たります。</span></div>
        <div class="choice is-static">
          ${SQ.avatar("ツ", 60, { lg: true })}
          <div><b class="mono">tsubasa-dev</b><span>ツバサ</span><span>GitHub のユーザー ID 48120937</span></div>
        </div>
        <p class="props-note" id="invite-limit-note">この人はまだ${t("organization")}の人数に数えられていないため、上限に達している間は招待できません。</p>
        <div class="form-row">
          <div class="field"><span class="field-label">ロール</span><div class="segmented" role="radiogroup"><label><input type="radio" name="role-full" checked><span>一般</span></label><label><input type="radio" name="role-full"><span>${t("leader")}</span></label></div></div>
          <button class="btn is-primary" type="button" disabled aria-describedby="invite-limit-note">${icon("mail")}招待する</button>
        </div>
        <p class="props-note">人数が上限に達したときの表示の見本です。手段、ユーザー名、「確かめる」は押せるままです（すでに${t("organization")}にいる人は、上限でも招待できるため）。まだ人数に数えられていない人を確かめた後だけ、「招待する」を押せません。Google は、メールアドレスだけでは数えられているかを前もって知れないので押せるままにし、断られたら上限の枠を出します。人数は${t("admin")}と、いずれかの${t("workspace")}に所属しているか招待されている人を数えます。</p>
      </div>
    </section>
    <section class="section" aria-labelledby="members-invitations"><div class="section-head"><h2 class="section-title" id="members-invitations">承諾待ちの招待</h2><span class="section-hint">${t("leader")}と${t("admin")}にだけ見えます</span></div>
      ${D.invitations.length ? `<div class="table-wrap"><table class="table" aria-label="承諾待ちの招待の一覧"><thead><tr><th>名前</th><th>手段</th><th>ロール</th><th>招待した日</th><th class="is-actions"><span class="visually-hidden">操作</span></th></tr></thead><tbody>${D.invitations.map((i) => `<tr>
        <td class="mono is-wrap">${esc(i.login)}</td>
        <td>${i.via === "google" ? "Google" : "GitHub"} ${i.expired ? `<span class="chip is-danger">期限切れ</span>` : i.expires ? `<span class="props-note">${esc(i.expires)} まで</span>` : ""}</td>
        <td>${i.role === "member" ? "一般" : t("leader")}</td>
        <td class="mono">${esc(i.at)}</td>
        <td class="is-actions"><button class="btn is-sm is-quiet" type="button" aria-label="${esc(i.login)} への招待を取り消す" data-toast="招待を取り消しました">取り消す</button></td>
      </tr>`).join("")}</tbody></table></div>`
      : SQ.emptyState("mail", "承諾待ちの招待はありません", "招待した人が承諾するまで、ここに並びます。")}
    </section>
    <section class="section"><div class="section-head"><h2 class="section-title">招待する（自分用の${t("organization")}）</h2></div>
      <div class="callout is-info">${icon("shield")}<span>自分用の${t("organization")}は自分だけで使うため、人を招待できません。</span></div>
      <p class="props-note">自分用の${t("organization")}（<code>kind</code> が <code>personal</code>）の表示の見本です。招待のフォームも人数の右肩も、「承諾待ちの招待」の節と頭の数字の「招待中」も出さず、理由だけを案内します。サーバーも招待を 409 の <code>personal_organization</code> で断ります。</p>
    </section>`;
});
</script>
</body>
</html>
