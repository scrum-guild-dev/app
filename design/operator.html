<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrum Guild 運用</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="app"></div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";
// 狭い幅の操作は左端をそろえ、折り返しの間隔を --space-1 に詰める。
// 運用（運用者）: 組織の一覧、作成、停止と再開、管理者の指名し直し。組織の中のデータは出さない。
// 組織ごとの集計は、人数と上限、閉じていないワークスペースの数、削除していないタスクの数、添付ファイルの上限、最後に使われた日時。
// 人数が上限以上なら「上限に達した」の印を出す。添付ファイルと Wiki の使用量と上限を出す。
// 作った日時は列にせず、名前の列の slug の行に並べる（1280px の画面で表が横スクロールせずに収まる列の数にするため）
// 枠は本番の /operator と同じ幅の広い紙（.gate.is-wide）1枚で、左のメニューと見出しの集計を持たない（#997）
// 名前の直後、ほかの印の前に種類の印（チーム用、自分用）を出す。自分用（personal）の行は、人数 / 上限の列を空（ダッシュ）にし、上限に達した印と管理者の状態の印を出さず、
// 管理者の指名と人数と容量の上限の変更を置かない（添付ファイルの上限の値は出す。停止、再開、停止の理由の切り替えはできる）
const { D, t, icon, esc } = SQ;
const K = D.operator.organizations;
// 本番の src/lib/operator-status.ts と同じ順で、最優先だけを見せ、残りも読み上げる。
function organizationStatuses(k) {
  return [
    k.trialEndsOn && k.trialExpired && { label: "お試し期限切れ", tone: "danger", icon: "alert" },
    k.suspended && k.purgeOn && { label: "解約", tone: "danger", icon: "alert" },
    !k.personal && !k.admins && { label: `${t("admin")}不在`, tone: "danger", icon: "alert" },
    !k.personal && k.adminExpired && { label: "招待期限切れ", tone: "danger", icon: "alert" },
    k.suspended && { label: "停止中", tone: "warn", icon: "clock" },
    !k.personal && k.adminPending && { label: "指名待ち", tone: "warn", icon: "clock" },
  ].filter(Boolean);
}
// 契約の印。添付ファイルの上限の列の値の下に出す。自分用はパーソナル、契約の無いチーム用の組織は未契約（本番の operator の planLabel と同じ）
function planChip(k) {
  return `<span class="chip"><span class="visually-hidden">プラン: </span>${esc(k.plan || (k.personal ? "パーソナル" : "未契約"))}</span>`;
}
function organizationSummary(k) {
  const states = organizationStatuses(k);
  const primary = states[0];
  return `<summary><span class="visually-hidden">${esc(k.name)} </span><span class="chip">${k.personal ? "自分用" : "チーム用"}</span> ${primary ? `<span class="table-details-alert is-${primary.tone}">${icon(primary.icon)}${esc(primary.label)}</span>${states.slice(1).map((state) => `<span class="visually-hidden">、${esc(state.label)}</span>`).join("")}` : ""}詳細</summary>`;
}


SQ.mount("operator", () => `
  <div class="gate-brand">${SQ.brandMark}<span class="visually-hidden">Scrum Guild</span></div>
  <h1 class="gate-title">運用</h1>
  <div class="form-actions"><button class="btn is-primary" type="button" data-dialog="createOrganization">${icon("plus")}${t("organization")}を作る</button></div>
  <div class="callout is-info">${icon("shield")}<span>運用者は${t("organization")}の中（タスク、メンバー、記録、添付ファイルの中身など）を見られません。ここに出すのは名前、slug、状態と、数、上限、日時だけです。</span></div>
  <div class="table-wrap"><table class="table is-stacked"><thead><tr><th class="is-name">${t("organization")}・slug</th><th class="is-num">人数 / 上限</th><th class="is-num">${t("workspace")}の数</th><th class="is-num">${t("task")}の数</th><th class="is-num">添付・Wiki / 上限</th><th>最後に使われた日時</th><th class="is-actions"><span class="visually-hidden">操作</span></th></tr></thead>
    <tbody>${K.map((k) => `<tr>
      <td class="is-name">${esc(k.name)}${k.selfCreated || k.trialEndsOn || k.suspended || (!k.personal && (!k.admins || k.adminPending || k.adminExpired)) ? `<details class="table-details">${organizationSummary(k)}<div class="table-details-body">${k.selfCreated ? ` <span class="chip">自分で作った${t("organization")}</span>` : ""}${k.trialEndsOn ? ` <span class="chip">${esc(SQ.formatTrialStopDateTime(k.trialEndsOn))} ごろに止まります</span>` : ""}${k.trialExpired ? ` <span class="chip is-danger">${icon("alert")}お試しの期限を過ぎています</span>` : ""}${k.suspended ? ` <span class="chip is-warn">停止 ${esc(k.suspended)}</span>` : ""}${k.purgeOn ? ` <span class="chip is-danger">${esc(k.purgeOn)} に消す</span>` : ""}${k.personal ? "" : `${!k.admins ? ` <span class="chip is-danger">${t("admin")}がいない</span>` : ""}${k.adminPending ? ` <span class="chip is-warn">${icon("clock")}${t("admin")}は指名済み、ログイン待ち</span>` : ""}${k.adminExpired ? ` <span class="chip is-danger">${icon("alert")}${t("admin")}の招待の URL は期限切れ</span>` : ""}`}</div></details>` : `<div><span class="chip">${k.personal ? "自分用" : "チーム用"}</span></div>`}<span class="props-note"><span class="mono">${esc(k.slug)}</span> · 作成 <span class="mono">${esc(k.created)}</span></span></td>
      <td class="is-num" data-label="人数 / 上限">${k.personal ? `<span class="props-note" aria-hidden="true">—</span><span class="visually-hidden">本人1人だけ</span>` : `${k.users}&nbsp;/&nbsp;${k.limit}${k.users >= k.limit ? `<br><span class="chip is-warn">${icon("alert")}上限に達した</span>` : ""}`}</td><td class="is-num" data-label="${t("workspace")}の数">${k.wss}</td><td class="is-num" data-label="${t("task")}の数">${k.tasks.toLocaleString()}</td>
      <td class="is-num" data-label="添付・Wiki / 上限">${SQ.storageBytes(k.slug === "aoba" ? Math.round(D.storage.used * 1024 ** 3) : k.usedBytes || 0)} / ${SQ.storageBytes(k.quota * 1024 ** 3)}<br>${planChip(k)}${k.personal ? "" : `${k.plan ? "" : `<br><button class="link-btn" type="button" data-dialog="changeQuota" aria-label="「${esc(k.name)}」の人数と容量の上限を変える">人数と容量の上限を変える</button>`}${k.purgeDue ? "" : `<br><button class="link-btn" type="button" data-dialog="changePlan" aria-label="「${esc(k.name)}」のプランを変える">プランを変える</button>`}`}</td>
      ${k.lastUsed ? `<td class="mono" data-label="最後に使われた日時">${esc(k.lastUsed)}</td>` : `<td class="props-note" data-label="最後に使われた日時">まだ使われていない</td>`}      <td class="is-actions"><span class="table-actions is-wrap">
        ${k.purgeDue ? `<span class="props-note">消す予定日を過ぎたので、再開も停止の理由の切り替えも${k.personal ? "" : `${t("admin")}の指名も`}できません</span>` : k.personal ? "" : `<button class="btn is-sm is-quiet" type="button" data-dialog="reassignAdmin">${t("admin")}を指名</button>`}
        ${k.purgeDue ? "" : k.suspended ? `<button class="btn is-sm is-quiet" type="button" data-dialog="changeSuspension">停止の理由を変える</button><button class="btn is-sm is-quiet" type="button" data-toast="再開しました">再開する</button>` :`<button class="btn is-sm is-quiet is-danger" type="button" data-dialog="suspendOrganization">停止する</button>`}
      </span></td></tr>`).join("")}</tbody></table></div>
  <div class="form-actions"><button class="btn is-sm is-quiet" type="button" data-toast="見本のため、ログアウトしません">${t("logout")}</button></div>`, { operator: true });
</script>
</body>
</html>
