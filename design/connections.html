<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrum Guild 接続</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Old+Mincho:wght@700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="app"></div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";
// 接続: 取り込み元の一覧と、新しい接続の登録
const { D, t, icon, esc, pageHead, avatarOf, user } = SQ;
const STATE = { active: ["is-ok", "有効"], error: ["is-error", "エラー"], stopped: ["is-stopped", "停止"] };
const PROVIDER = { backlog: ["link", "Backlog"], github: ["git", "GitHub"] };

function conn(c) {
  const mine = c.owner === D.me;
  const next = (pre, post) => pre + (mine ? t("leader") : `登録した${user(c.owner).name}か${t("leader")}`) + post;
  const [cls, label] = STATE[c.status];
  return `<section class="panel conn">
    <div class="conn-head">
      <span class="kind is-story">${icon(PROVIDER[c.provider][0])}</span>
      <h2 class="conn-name">${esc(c.name)}</h2>
      <span class="state-badge ${cls}">${label}</span>
      <span class="conn-actions">
        ${mine ? `<button class="btn is-sm" type="button" data-toast="3 件届きました">${icon("refresh")}今すぐ同期</button><button class="btn is-sm is-quiet" type="button">編集</button>`
          : `<button class="btn is-sm is-quiet" type="button">止める</button><button class="btn is-sm is-quiet is-danger" type="button">削除</button>`}
      </span>
    </div>
    ${c.error ? `<div class="callout is-warn">${icon("alert")}<span>${esc(c.error)}（${esc(c.errorAt)}、${c.failures} 回続けて失敗）${esc(next("続けて失敗するときは、", "に伝えてください。"))}</span></div>` : ""}
    ${c.stoppedReason ? `<div class="callout is-danger">${icon("alert")}<span>${esc(c.stoppedReason)}${esc(next("", "に、止まっていることを伝えてください。"))}</span></div>` : ""}
    <dl class="facts">
      <div><dt>登録した人</dt><dd>${avatarOf(c.owner)}${esc(user(c.owner).name)}</dd></div>
      <div><dt>取り込み元</dt><dd>${PROVIDER[c.provider][1]}・<span class="mono">${esc(c.host)}</span></dd></div>
      <div><dt>${c.scope.mode === "include" ? "取り込む範囲" : "除外する範囲"}</dt><dd>${c.scope.items.map((s) => `<span class="tag">${esc(s)}</span>`).join("")}</dd></div>
      <div><dt>最後に成功</dt><dd class="mono">${esc(c.lastSuccess)}</dd></div>
      <div><dt>認証情報</dt><dd class="mono">••••${esc(c.last4)}</dd></div>
      <div><dt>状態から${t("column")}への対応</dt><dd>${c.mappings.length ? c.mappings.map(([a, b]) => `<span class="tag">${esc(a)} → ${esc(b)}</span>`).join("") : "なし（先頭の列に置く）"}</dd></div>
    </dl>
  </section>`;
}

function register() {
  return `<section class="section" aria-labelledby="new"><div class="section-head"><h2 class="section-title" id="new">新しい${t("connection")}を登録する</h2><span class="section-hint">自分の認証情報で、自分の担当分を取り込みます</span></div>
  <div class="panel"><ol class="steps">
    <li class="step is-done"><div class="step-body"><span class="step-title">認証情報を入れて登録する</span>
      <div class="choice-list" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
        <label class="choice"><input type="radio" name="prov" checked><div><b>Backlog</b><span>課題を取り込みます</span></div></label>
        <label class="choice"><input type="radio" name="prov"><div><b>GitHub</b><span>Issue、PR、自分宛てのレビュー依頼のうち、自分の担当分を取り込みます</span></div></label>
      </div>
      <div class="form-row">
        <label class="field" for="cname"><span class="field-label">表示名</span><input class="input" id="cname" value="ミナトの GitHub" placeholder="例: ミナトの GitHub"></label>
        <label class="field" for="key"><span class="field-label">fine-grained personal access token</span><input class="input" id="key" type="password" autocomplete="off" placeholder="GitHub の設定で発行したもの"></label>
      </div>
      <span class="field-hint">GitHub の設定で発行した fine-grained PAT を入れます。取り込むリポジトリを選び、Issues と Pull requests を読むだけの権限にしてください。</span>
      <div class="callout is-warn">${icon("alert")}<span>取り込んだ内容は、private なリポジトリのものも含めて${t("workspace")}の全員に見えます。範囲を選ぶまでは何も取り込みません。</span></div>
      <div class="callout is-info">${icon("shield")}<span>組織のリポジトリは、組織が fine-grained PAT を承認制にしていると、承認されるまで公開リポジトリしか読めません。private を取り込むときは、組織の管理者に承認を頼んでください。</span></div>
      <div class="form-actions"><button class="btn is-primary" type="button" data-toast="登録しました。続けて取り込む範囲を選んでください">登録する</button></div></div></li>
    <li class="step"><div class="step-body"><span class="step-title">取り込む範囲を選ぶ</span>
      <span class="field-hint">登録すると、同じ画面で続けて範囲を選べます。</span>
      <fieldset class="choice-list"><legend class="field-label">取り込むリポジトリ</legend>
        <label class="toggle"><input type="checkbox" checked><span>acme/shop</span></label>
        <label class="toggle"><input type="checkbox"><span>acme/web</span></label>
        <label class="toggle"><input type="checkbox"><span>acme/sandbox</span></label>
      </fieldset>
      <span class="field-hint">選んだものだけを取り込みます。選ばずに保存すると、何も取り込みません。後で選び直せます。</span>
      <div class="form-actions"><button class="btn is-primary" type="button" data-toast="範囲を保存しました">範囲を保存する</button><button class="btn is-quiet" type="button">あとで選ぶ</button></div></div></li>
  </ol></div></section>`;
}

SQ.mount("connection", () => `
  ${pageHead(D.workspaces.wa.name, t("connection"), [
    ["is-ok", "check", "有効", D.connections.filter((c) => c.status === "active").length],
    ["is-warn", "alert", "エラー", D.connections.filter((c) => c.status === "error").length],
    ["is-danger", "alert", "停止", D.connections.filter((c) => c.status === "stopped").length],
  ])}
  <p class="action-note">取り込みは15分ごと。「今すぐ同期」は登録した本人が、${t("connection")}ごとに5分に1回まで押せます。${t("leader")}は他のメンバーの${t("connection")}を止めたり削除したりできますが、範囲は変えられません。</p>
  ${D.connections.map(conn).join("")}
  ${register()}`);
</script>
</body>
</html>
