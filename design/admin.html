<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrum Guild 組織の管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="app"></div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";
// 390px の積んだ行でも、静かな操作の文字を行の本文にそろえる。
// 組織の管理（管理者）: お試し、プラン、ユーザー、ワークスペース、添付ファイルの合計、組織の休日、配分と積載量の合計、取り込み元の応答、AI の機能、変更の履歴
const { D, t, icon, esc, pageHead, avatarOf, user, meter } = SQ;
const A = D.admin;
// ?workspace-limit は、自分用で利用中3個・終了済み1個の再開が断られた状態。
const workspaceLimit = new URLSearchParams(location.search).has("workspace-limit");
if (workspaceLimit) A.workspaces.push({ name: "資料整理", members: 1, leaders: 1, created: "2026-11-01" });
// 変更の履歴の内容の文。本番の辞書（src/shared/vocabulary.ts の orgHistory*）と同じ文を作る
const AUDIT = {
  organizationCreated: (name) => `${t("organization")}「${name}」を作りました`,
  adminDesignated: (name) => `${name}を${t("admin")}に指名しました`,
  userDisabled: (name) => `${name}を無効にしました`,
};
// お試しの節の状態。?trial=lastday（期限の当日）か ?trial=expired（期限を過ぎて、定期処理が止めるまでの間）で切り替える。
// 本番は TrialSetting.svelte が days_left の 0 と負で同じ出し分けをする
const TRIAL_STATE = new URLSearchParams(location.search).get("trial");
// プランの節の状態。既定はお試し中の未契約の組織。?plan=team で契約のある組織にする（有料のプランにするとお試しは終わるので、お試しの節を出さない）。
// 本番は PlanSetting.svelte が organization の plan で出し分ける
const PLAN_CONTRACTED = new URLSearchParams(location.search).get("plan") === "team";
const PLAN = PLAN_CONTRACTED
  ? { terms: "チーム・月払い", extra: "+10&nbsp;GB × 2&nbsp;口", members: 15, quota: "50&nbsp;GB" }
  : { terms: null, extra: null, members: 15, quota: "30&nbsp;GB" };
function setting(title, desc, body) {
  return `<section class="setting"><div class="setting-head"><h2 class="setting-title">${title}</h2><p class="setting-desc">${desc}</p></div><div class="setting-body">${body}</div></section>`;
}

SQ.mount("admin", () => `
  ${pageHead("管理者だけが見られます", "組織の管理", [
    ["", "users", "ユーザー", A.users.filter((u) => !u.disabled).length],
    ["", "shield", t("admin"), A.users.filter((u) => u.admin && !u.disabled).length],
    ["", "", `進行中の${t("workspace")}`, A.workspaces.filter((w) => !w.closed).length],
  ], `<button class="btn is-primary" type="button" data-dialog="createWorkspace">${icon("plus")}${t("workspace")}を作る</button>`)}
  <div class="settings">
    ${PLAN_CONTRACTED ? "" : setting("お試し", "継続して使うには、運用者に問い合わせてください。", `
      <p class="mono">${esc(SQ.formatTrialStopDateTime("2026-11-19"))} ごろに止まります</p>
      ${TRIAL_STATE === "expired"
        ? `<p><span class="chip is-danger">${icon("alert")}お試しの期限を過ぎています</span></p>`
        : TRIAL_STATE === "lastday"
          ? `<p class="props-note">今日までです</p>`
          : `<p class="props-note">残り 30 日</p>`}`)}
    ${setting("プラン", "人数と添付ファイルの上限は、プランと追加容量で決まります。", `
      <dl class="props">
        <div><dt>契約</dt><dd>${PLAN.terms === null ? `<span class="chip">未契約</span>` : esc(PLAN.terms)}</dd></div>
        ${PLAN.terms === null ? "" : `<div><dt>追加容量</dt><dd>${PLAN.extra}</dd></div>`}
        <div><dt>人数の上限</dt><dd>${PLAN.members}&nbsp;人</dd></div>
        <div><dt>添付ファイルの上限</dt><dd>${PLAN.quota}</dd></div>
      </dl>
      ${PLAN.terms === null ? `<p class="props-note">まだ契約していません。上限は運用者が決めた値です。</p>` : ""}
      <div class="callout is-info">${icon("mail")}<span>プラン、支払いの周期、追加容量を変えるときは、運用者に問い合わせてください。</span></div>`)}
    ${setting("ユーザー", `${t("admin")}は他のユーザーを${t("admin")}に指名でき、解除もできます。最後の${t("admin")}は解除できません。無効にした人は${t("organization")}に入れず、すべての${t("workspace")}から外れます。名前、完了の記録、経験値は残ります。`, `
      <div class="table-wrap"><table class="table is-stacked" aria-label="${t("organization")}のユーザーの一覧"><thead><tr><th class="is-name">名前</th><th>${t("admin")}</th><th class="is-num">所属</th><th>最後に入った日</th><th class="is-actions"><span class="visually-hidden">操作</span></th></tr></thead>
        <tbody>${A.users.map((r) => {
          const name = esc(user(r.who).name);
          const self = r.who === D.me;
          // 自分の解除は確認を経る（ほかに無効でない管理者がいるとき）。無効の人の切り替えは押せず、理由を読み上げの説明で結ぶ
          const toggleAttrs = r.disabled
            ? `disabled aria-describedby="u-off-${r.who}"`
            : self && r.admin ? `data-dialog="revokeSelfAdmin"` : "";
          return `<tr>
          <td class="is-name"><span class="person is-wrap">${avatarOf(r.who)}${name}</span>${r.disabled ? ` <span class="chip">無効</span>` : ""}</td>
          <td data-label="${t("admin")}"><label class="toggle"><input type="checkbox" ${r.admin ? "checked" : ""} ${toggleAttrs} aria-label="${name}を${t("admin")}にする"></label>${r.disabled ? `<span class="visually-hidden" id="u-off-${r.who}">無効の人は${t("admin")}に指名できません</span>` : ""}</td>
          <td class="is-num" data-label="所属">${r.wss}</td>
          <td class="mono" data-label="最後に入った日">${r.lastLogin ?? `<span aria-hidden="true">—</span><span class="visually-hidden">まだ入っていません</span>`}</td>
          <td class="is-actions">${r.disabled
            ? `<button class="btn is-sm is-quiet" type="button" aria-label="${name}を有効に戻す" data-toast="${name}を有効に戻しました。入るには${t("workspace")}への招待が要ります">有効に戻す</button>`
            : self ? "" : `<button class="btn is-sm is-quiet is-danger" type="button" aria-label="${name}を無効にする" data-dialog="disableUser" data-name="${name}" data-admin="${r.admin}">無効にする</button>`}</td></tr>`;
        }).join("")}</tbody></table></div>`)}
    ${setting("ユーザー（自分用の" + t("organization") + "）", `自分用の${t("organization")}は自分だけで使うため、${t("admin")}は本人1人のままです。`, `
      <div class="callout is-info">${icon("shield")}<span>自分用の${t("organization")}は自分だけで使うため、${t("admin")}を増やしたり外したりできません。あなたが${t("admin")}のままです。</span></div>
      <div class="table-wrap"><table class="table is-stacked" aria-label="${t("organization")}のユーザーの一覧"><thead><tr><th class="is-name">名前</th><th>${t("admin")}</th><th class="is-num">所属</th><th>最後に入った日</th><th class="is-actions"><span class="visually-hidden">操作</span></th></tr></thead>
        <tbody><tr>
          <td class="is-name"><span class="person is-wrap">${avatarOf(D.me)}${esc(user(D.me).name)}</span></td>
          <td data-label="${t("admin")}"><label class="toggle"><input type="checkbox" checked disabled aria-describedby="u-personal" aria-label="${esc(user(D.me).name)}を${t("admin")}にする"></label><span class="visually-hidden" id="u-personal">自分用の${t("organization")}では、${t("admin")}の指名と解除はできません</span></td>
          <td class="is-num" data-label="所属">1</td>
          <td class="mono" data-label="最後に入った日">10/20</td>
          <td class="is-actions"></td></tr></tbody></table></div>
      <p class="props-note">自分用の${t("organization")}（<code>kind</code> が <code>personal</code>）の表示の見本です。${t("admin")}の切り替えは全員の行で押せなくし、理由を表の上に出して、読み上げの説明にも結びます。サーバーも指名と解除を 409 の <code>personal_organization</code> で断ります。</p>`)}
    ${setting(t("workspace"), `作った${t("workspace")}の一覧です。終了した${t("workspace")}も含みます。${t("member")}の数は${t("leader")}を含みます。`, !A.workspaces.length
      ? SQ.emptyState("users", `まだ${t("workspace")}がありません`,
          `チームや用途ごとに作ります。${t("member")}の招待は、作った${t("workspace")}の${t("leader")}が行います。`,
          `<button class="btn is-sm" type="button" data-dialog="createWorkspace">${icon("plus")}${t("workspace")}を作る</button>`)
      : `
      ${workspaceLimit ? `<div class="callout is-warn" role="alert">${icon("alert")}<span class="wrap-anywhere">「${esc(A.workspaces.find(w => w.closed)?.name || "終了した案件")}」は再開できません。自分用の${t("workspace")}は、利用中のものを3個まで使えます（今${A.workspaces.filter(w => !w.closed).length}個）。この一覧で今ある${t("workspace")}を終了して枠を空けてください。</span></div>` : ""}
      <div class="table-wrap"><table class="table is-stacked" aria-label="${t("workspace")}の一覧"><thead><tr><th class="is-name">名前</th><th class="is-num">${t("member")}数</th><th class="is-num">${t("leader")}数</th><th>作った日</th><th class="is-actions"><span class="visually-hidden">操作</span></th></tr></thead>
        <tbody>${A.workspaces.map((w) => `<tr><td class="is-name">${esc(w.name)}${w.closed ? ` <span class="chip">終了 ${w.closed}</span>` : ""}${!w.closed && !w.leaders ? ` <span class="chip is-warn">${t("leader")}がいない</span>` : ""}</td>
          <td class="is-num" data-label="${t("member")}数">${w.members}</td><td class="is-num" data-label="${t("leader")}数">${w.leaders}</td><td class="mono" data-label="作った日">${w.created}</td>
          <td class="is-actions">${w.closed ? `<button class="btn is-sm is-quiet" type="button" data-toast="${t("workspace")}を再開しました">再開する</button>` : `<button class="btn is-sm is-quiet" type="button" data-dialog="closeWorkspace">終了する</button>`}</td></tr>`).join("")}</tbody></table></div>`)}
    ${setting("添付ファイルと Wiki の容量", `組織の添付ファイルと Wiki の最新本文・過去版の合計。上限は運用者が決めます。上限に達すると、どの${t("workspace")}でも新しく添付できなくなります。`, `
      ${meter(D.storage.used, D.storage.quota, { storage: true, note: `縦の線は80%の位置です。超えると${t("admin")}に通知します。` })}
      <span class="props-note">${Math.round(D.storage.used * 1024 ** 3).toLocaleString("ja-JP")} バイト使用中</span>
      ${D.storage.used >= D.storage.quota ? `<div class="callout is-danger">${icon("alert")}<span>容量の上限に達したため、新しく添付できません。上げた人か${t("workspace")}の${t("leader")}が不要な添付ファイルを消すか、運用者に上限の引き上げを依頼すると添付できます。</span></div>` : D.storage.used / D.storage.quota > 0.8 ? `<div class="callout is-warn">${icon("alert")}<span>上限の80%を超えています。上げた人か${t("workspace")}の${t("leader")}が不要な添付ファイルを消すか、運用者に上限の引き上げを依頼してください。</span></div>` : ""}
      <p class="field-hint">終了したワークスペースと、削除後30日の保持中の Wiki も含みます。Wiki は題と本文を数えます。</p>
      <div class="table-wrap"><table class="table is-stacked"><thead><tr><th>内訳</th><th class="is-num">使用量</th></tr></thead>
        <tbody><tr><td class="is-name wrap-anywhere">組織の Wiki</td><td class="is-num" data-label="使用量">${SQ.storageBytes(D.storage.organizationWikiBytes || 0)}</td></tr>${D.storage.byWorkspace.map(([ws, n, gb]) => `<tr><td class="is-name wrap-anywhere">${esc(D.workspaces[ws].name)}${D.workspaces[ws].closed ? ` <span class="chip">終了済み</span>` : ""}</td><td class="is-num" data-label="使用量">${SQ.storageBytes(Math.round(gb * 1024 ** 3))}</td></tr>`).join("")}</tbody></table></div>`)}
    ${new URLSearchParams(location.search).has("personal") ? setting(t("delegatee"), t("delegateeDesc"), `
      <div class="form">${D.delegatees.length ? D.delegatees.map((row) => `<form class="field" aria-labelledby="delegatee-label-${row.id}" data-delegatee-rename="${row.id}">
        <label class="field-label" id="delegatee-label-${row.id}" for="delegatee-${row.id}">${esc(row.name)}</label>
        <input class="input" id="delegatee-${row.id}" value="${esc(row.name)}" maxlength="50" required>
        <div class="form-actions"><button class="btn is-sm" type="submit">${t("delegateeSave")}</button><button class="btn is-sm is-danger" type="button" data-delegatee-delete="${row.id}">${t("delegateeRemove")}</button></div>
      </form>`).join("") : SQ.emptyState("users", t("delegateeEmpty"), t("delegateeEmptyText"))}</div>`) : ""}

    ${setting("組織の休日", `祝日など、すべての${t("workspace")}に効く休日。日付の一覧を貼り付けて、まとめて登録できます。`, `
      <div class="field"><label class="field-label" for="paste">貼り付けて登録</label><textarea class="textarea" id="paste" aria-describedby="paste-hint" placeholder="2027-02-11 建国記念の日&#10;2027-02-23 天皇誕生日"></textarea><span class="field-hint" id="paste-hint">1行に1日。日付（2026-11-03 か 2026/11/3、2000〜2099 年）のあとに、空白、タブ、カンマで区切って名前を書けます。表計算から写した行は、名前より後の列を読みません。登録済みの日付は飛ばします。</span></div>
      <div class="form-actions"><button class="btn" type="button" data-toast="2 日を登録しました">登録する</button></div>
      ${!A.holidays.length
        ? SQ.emptyState("calendar", "まだ休日がありません", `登録した日は、${t("capacity")}の計算で全員が稼働しない日になります。`)
        : `<ul class="party-list" aria-label="登録した休日">${A.holidays.map(([d, n]) => `<li><span class="mono">${d}</span>${n ? `<span class="party-list-text">${esc(n)}</span>` : ""}<button class="icon-btn is-danger party-list-end" type="button" aria-label="${d} を消す" data-toast="${d}${n ? `（${esc(n)}）` : " "}を消しました">${icon("trash")}</button></li>`).join("")}</ul>`}`)}
    ${setting("配分の合計", `ユーザーごとの、すべての${t("workspace")}の配分の合計。100% を超えた月は本人にも知らせています。`, !A.allocTotals.length
      ? `<p class="props-note">${t("workspace")}ができて、${t("leader")}が配分を決めると出ます。</p>`
      : `
      <div class="table-wrap"><table class="table"><thead><tr><th>名前</th><th class="is-num">10月</th><th class="is-num">11月</th></tr></thead>
        <tbody>${A.allocTotals.map(([n, a, b]) => `<tr><td>${esc(n)}</td>${[a, b].map((v) => `<td class="is-num" ${v > 100 ? 'style="color:var(--color-danger)"' : ""}>${v > 100 ? "▲ " : ""}${v}%</td>`).join("")}</tr>`).join("")}</tbody></table></div>`)}
    ${setting(`${t("capacity")}の合計`, `ユーザーごとの、すべての${t("workspace")}の作業量の合計を、ユーザーの基準と並べたもの。`, !A.loadTotals.length
      ? `<p class="props-note">${t("workspace")}で${t("sprint")}に${t("task")}が入ると出ます。</p>`
      : `
      <div class="table-wrap"><table class="table"><thead><tr><th>名前</th><th>10月</th><th>11月</th></tr></thead>
        <tbody>${A.loadTotals.map(([u, ...cells]) => `<tr><td><span class="person">${avatarOf(u)}${esc(user(u).name)}</span></td>${cells.map((c) => `<td>${SQ.miniCap(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`)}
    ${setting("取り込み元の応答", `取り込み元の応答そのもの（本文とラベルを含む）を保存するか。保存しなければ、取り込み元の本文を一度も書きません。`, `
      <div class="choice-list">
        <label class="choice"><input type="radio" name="payload" checked><div><b>保存しない</b><span>タイトル、キー、状態、期限、URL など、${t("task")}として扱うのに要る属性だけを持ちます</span></div></label>
        <label class="choice"><input type="radio" name="payload"><div><b>保存する</b><span>次に同期した項目から保存します。さかのぼって取り直しません</span></div></label></div>
      <p class="field-hint">保存しない側に切り替えると、保存済みの応答を消します。</p>`)}
    ${setting("AI の機能", `${t("assistant")}など、AI を使う機能。有効にすると、頼んだ内容と、開いている画面の${t("task")}などのデータを送る先に送ります。`, `
      <label class="toggle"><input type="checkbox" data-ai-enabled ${D.ai.enabled ? "checked" : ""}>この${t("organization")}で AI の機能を使う</label>
      <div class="choice-list" role="radiogroup" aria-label="送る先">
        ${Object.entries(SQ.PROVIDER).map(([v, name]) => `<label class="choice"><input type="radio" name="ai-provider" value="${v}" data-ai-provider ${D.ai.provider === v ? "checked" : ""} ${D.ai.enabled ? "" : "disabled"}><div><b>${name}</b><span>${v === "claude" ? "既定。Anthropic の API で呼びます" : "OpenAI の API で呼びます"}。送る先を変えても、できることは変わりません</span></div></label>`).join("")}</div>
      ${D.ai.enabled ? "" : `<p class="field-hint">送る先は、有効にすると選べます。</p>`}
      ${meter(D.ai.used, D.ai.limit, { unit: "百万トークン", note: `今月の利用。${D.ai.resets} に 0 に戻ります。縦の線は 80% の位置。上限は運用者が決めます。上限に達すると、その月は AI の機能が止まります。` })}`)}
    ${setting("変更の履歴", `${t("admin")}の指名、運用者の操作、${t("workspace")}の作成と終了など、${t("organization")}の単位の変更を新しい順に出します。${t("workspace")}の中の変更（${t("member")}の所属など）は出しません。`, !A.audit.length
      ? SQ.emptyState("clock", "まだ変更の履歴がありません", `${t("admin")}の指名や${t("workspace")}の作成をすると、ここに残ります。`)
      : `
      <div class="table-wrap"><table class="table is-stacked" aria-label="${t("organization")}の変更の履歴"><thead><tr><th>日時</th><th>した人</th><th>内容</th></tr></thead>
        <tbody>${A.audit.map(([at, who, kind, name]) => `<tr><td class="mono">${at}</td><td data-label="した人">${who ? `<span class="person is-wrap">${avatarOf(who)}${esc(user(who).name)}</span>` : `<span class="props-note">運用者</span>`}</td><td class="is-wrap" data-label="内容">${esc(AUDIT[kind](name))}</td></tr>`).join("")}</tbody></table></div>
      ${A.auditMore ? `<div class="form-actions"><button class="btn is-sm" type="button">古い履歴を読む</button></div>` : ""}`)}
  </div>`);
// 自分用の名簿。見本だけのデータで操作を確かめる。
document.addEventListener("submit", (event) => {
  const form = event.target.closest("[data-delegatee-rename]"); if (!form) return;
  event.preventDefault(); const row = D.delegatees.find((entry) => entry.id === form.dataset.delegateeRename);
  const name = form.querySelector("input").value.trim();
  if (!name || D.delegatees.some((entry) => entry !== row && entry.name === name)) return;
  row.name = name; SQ.redraw();
});
document.addEventListener("click", (event) => {
  const button = event.target.closest("[data-delegatee-delete]"); if (!button) return;
  const row = D.delegatees.find((entry) => entry.id === button.dataset.delegateeDelete);
  SQ.openDialog(t("delegateeDeleteTitle"), `<p>${esc(t("delegateeDeleteText", { name: row.name }))}</p>`,
    `<button class="btn is-primary" type="button" data-close-dialog>${t("delegateeCancel")}</button><button class="btn is-danger" type="button" data-delegatee-confirm="${row.id}">${t("delegateeRemove")}</button>`);
});
document.addEventListener("click", (event) => {
  const button = event.target.closest("[data-delegatee-confirm]"); if (!button) return;
  const id = button.dataset.delegateeConfirm;
  D.delegatees = D.delegatees.filter((entry) => entry.id !== id);
  for (const task of D.tasks) if (task.delegatee === id && !task.doneAt) task.delegatee = null;
  SQ.closeDialog(); SQ.redraw();
});
// 見本の中だけの切り替え。有効を外すと、アシスタントは「使えません」の表示になる
document.addEventListener("change", (ev) => {
  if (ev.target.matches("[data-ai-enabled]")) {
    D.ai.enabled = ev.target.checked; SQ.redraw();
    document.querySelector("[data-ai-enabled]").focus();
    SQ.toast(`${icon("check")}AI の機能を${D.ai.enabled ? "有効" : "無効"}にしました`);
  }
  if (ev.target.matches("[data-ai-provider]")) { D.ai.provider = ev.target.value; SQ.toast(`${icon("check")}送る先を${SQ.PROVIDER[D.ai.provider]}にしました`); }
});
</script>
